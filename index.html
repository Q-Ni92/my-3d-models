<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трансляция экрана</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 1.5rem; }
        .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 0.9rem; }
        
        .role-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .role-btn {
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            text-align: center;
        }
        .role-btn:hover { border-color: #667eea; }
        .role-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .role-icon { font-size: 1.5rem; display: block; margin-bottom: 6px; }
        
        .id-display {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            font-family: monospace;
            font-size: 1.1rem;
            user-select: all;
            display: none;
        }
        .id-display.visible { display: block; }
        
        .input-group { margin-bottom: 16px; display: none; }
        .input-group.visible { display: block; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
        }
        .input-group input:focus { outline: none; border-color: #667eea; }
        
        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn.primary { background: #667eea; color: white; }
        .action-btn.primary:hover { background: #5568d3; }
        .action-btn.danger { background: #dc3545; color: white; display: none; }
        .action-btn.danger.visible { display: block; }
        .action-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .status {
            text-align: center;
            margin-top: 16px;
            color: #666;
            font-size: 0.9rem;
            min-height: 20px;
        }
        
        .video-container {
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: none;
            aspect-ratio: 16/9;
        }
        .video-container.visible { display: block; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .error-box {
            background: #ffe6e6;
            color: #dc3545;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 0.9rem;
        }
        .error-box.visible { display: block; }

        .copy-hint {
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📱 Трансляция экрана</h1>
    <p class="subtitle">Android → ПК</p>

    <div id="errorBox" class="error-box"></div>

    <!-- Выбор роли -->
    <div class="role-select" id="roleSelect">
        <div class="role-btn" onclick="selectRole('streamer')">
            <span class="role-icon">📱</span>
            Телефон<br>(Раздать)
        </div>
        <div class="role-btn" onclick="selectRole('viewer')">
            <span class="role-icon">💻</span>
            Компьютер<br>(Смотреть)
        </div>
    </div>

    <!-- Блок для стримера -->
    <div id="streamerBlock" style="display: none;">
        <div class="id-display" id="myIdDisplay"></div>
        <p class="copy-hint">👆 Скопируйте этот код и отправьте на ПК</p>
        <button class="action-btn primary" id="btnStartStream" onclick="startStream()">🎬 Начать трансляцию</button>
        <button class="action-btn danger" id="btnStopStream" onclick="stopStream()">⏹ Остановить</button>
    </div>

    <!-- Блок для зрителя -->
    <div id="viewerBlock" style="display: none;">
        <div class="input-group visible" id="connectInput">
            <input type="text" id="streamerId" placeholder="Введите код с телефона">
        </div>
        <button class="action-btn primary" id="btnConnect" onclick="connectToStream()">🔗 Подключиться</button>
        <button class="action-btn danger" id="btnDisconnect" onclick="disconnect()">❌ Отключиться</button>
    </div>

    <div class="status" id="statusText"></div>

    <div class="video-container" id="videoContainer">
        <video id="videoElement" autoplay playsinline></video>
    </div>
</div>

<script>
    let peer = null;
    let localStream = null;
    let currentCall = null;
    let myRole = null;

    const errorBox = document.getElementById('errorBox');
    const statusText = document.getElementById('statusText');
    const videoElement = document.getElementById('videoElement');
    const videoContainer = document.getElementById('videoContainer');

    // Проверка браузера при загрузке
    window.addEventListener('load', () => {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isAndroid = /Android/.test(navigator.userAgent);
        
        if (isIOS) {
            showError('⛔ На iPhone трансляция экрана через сайт не работает. Используйте Android или ПК.');
            return;
        }
        
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            showError('⛔ Требуется HTTPS. Откройте сайт через защищенное соединение.');
            return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            showError('⛔ Ваш браузер не поддерживает захват экрана. Используйте Chrome.');
            return;
        }

        statusText.textContent = 'Выберите роль выше';
    });

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.add('visible');
        document.getElementById('roleSelect').style.display = 'none';
    }

    function selectRole(role) {
        myRole = role;
        document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');

        document.getElementById('streamerBlock').style.display = role === 'streamer' ? 'block' : 'none';
        document.getElementById('viewerBlock').style.display = role === 'viewer' ? 'block' : 'none';

        initPeer();
    }

    function initPeer() {
        peer = new Peer();

        peer.on('open', (id) => {
            if (myRole === 'streamer') {
                document.getElementById('myIdDisplay').textContent = id;
                document.getElementById('myIdDisplay').classList.add('visible');
                statusText.textContent = 'Ждем подключения зрителя...';
            } else {
                statusText.textContent = 'Введите код с телефона и нажмите "Подключиться"';
            }
        });

        // Стример принимает входящий звонок
        peer.on('call', (call) => {
            if (myRole === 'streamer' && localStream) {
                call.answer(localStream);
                statusText.textContent = 'Зритель подключен!';
                setupCall(call);
            }
        });

        peer.on('error', (err) => {
            statusText.textContent = 'Ошибка: ' + err.type;
        });
    }

    // === ЛОГИКА СТРИМЕРА ===
    async function startStream() {
        try {
            statusText.textContent = 'Запрос доступа к экрану...';
            
            localStream = await navigator.mediaDevices.getDisplayMedia({
                video: { mediaSource: "screen" },
                audio: false
            });

            // Превью у себя (опционально, можно скрыть)
            videoElement.srcObject = localStream;
            videoContainer.classList.add('visible');

            document.getElementById('btnStartStream').style.display = 'none';
            document.getElementById('btnStopStream').classList.add('visible');
            statusText.textContent = 'Трансляция идет. Ждем зрителя...';

            // Если пользователь нажмет "Стоп" в системном диалоге
            localStream.getVideoTracks()[0].onended = () => stopStream();

        } catch (err) {
            statusText.textContent = 'Ошибка: ' + err.message;
        }
    }

    function stopStream() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }
        videoContainer.classList.remove('visible');
        videoElement.srcObject = null;
        document.getElementById('btnStartStream').style.display = 'block';
        document.getElementById('btnStopStream').classList.remove('visible');
        statusText.textContent = 'Трансляция остановлена';
    }

    // === ЛОГИКА ЗРИТЕЛЯ ===
    function connectToStream() {
        const streamerId = document.getElementById('streamerId').value.trim();
        
        if (!streamerId) {
            statusText.textContent = 'Введите код комнаты!';
            return;
        }

        statusText.textContent = 'Подключение...';
        
        // Звоним стримеру (отправляем null, так как мы только смотрим)
        const call = peer.call(streamerId, null);
        setupCall(call);
    }

    function disconnect() {
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }
        videoContainer.classList.remove('visible');
        videoElement.srcObject = null;
        document.getElementById('btnConnect').style.display = 'block';
        document.getElementById('btnDisconnect').classList.remove('visible');
        statusText.textContent = 'Отключено';
    }

    // === ОБЩАЯ ЛОГИКА ВЫЗОВА ===
    function setupCall(call) {
        currentCall = call;

        call.on('stream', (remoteStream) => {
            videoElement.srcObject = remoteStream;
            videoContainer.classList.add('visible');
            statusText.textContent = '🔴 Идет трансляция';
            
            if (myRole === 'viewer') {
                document.getElementById('btnConnect').style.display = 'none';
                document.getElementById('btnDisconnect').classList.add('visible');
                document.getElementById('connectInput').classList.remove('visible');
            }
        });

        call.on('close', () => {
            statusText.textContent = 'Соединение разорвано';
            disconnect();
        });

        call.on('error', (err) => {
            statusText.textContent = 'Ошибка соединения: ' + err.type;
        });
    }
</script>

</body>
</html>
