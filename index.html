<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Mirror</title>
    <!-- Подключаем библиотеку PeerJS для P2P соединения -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Главный контейнер меню */
        #menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        /* Стили кнопок */
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            font-weight: bold;
            width: 200px;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-show {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .btn-watch {
            background-color: #10b981;
            color: white;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        .btn-stop {
            background-color: #ef4444;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            width: auto;
            margin-top: 10px;
            opacity: 0.8;
        }

        /* Контейнер видео (скрыт по умолчанию) */
        #stream-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Статус и ID */
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            max-width: 300px;
            text-align: center;
            word-break: break-all;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Главное меню -->
    <div id="menu">
        <button class="btn-show" onclick="startSharing()">ПОКАЗАТЬ</button>
        <button class="btn-watch" onclick="startWatching()">СМОТРЕТЬ</button>
    </div>

    <!-- Экран трансляции -->
    <div id="stream-view">
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="status"></div>
        <button class="btn-stop" onclick="stopStream()">Остановить</button>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let currentCall = null;
        
        const menu = document.getElementById('menu');
        const streamView = document.getElementById('stream-view');
        const videoElement = document.getElementById('remoteVideo');
        const statusText = document.getElementById('status');

        // Инициализация PeerJS (используем их бесплатный облачный сервер)
        function initPeer() {
            // Создаем Peer с рандомным ID
            peer = new Peer(null, {
                debug: 2
            });

            peer.on('open', (id) => {
                console.log('My peer ID is: ' + id);
                statusText.innerText = "ID подключения: " + id;
            });

            peer.on('error', (err) => {
                console.error(err);
                alert("Ошибка соединения: " + err.type);
                stopStream();
            });
        }

        // --- ЛОГИКА "ПОКАЗАТЬ" ---
        async function startSharing() {
            try {
                // 1. Запрашиваем захват экрана
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false // Можно включить true, если нужно передавать звук системы
                });

                // 2. Переключаем интерфейс
                showStreamInterface();
                
                // 3. Инициализируем соединение
                initPeer();

                // 4. Ждем входящего вызова от "Смотрящего"
                peer.on('call', (call) => {
                    call.answer(localStream); // Отвечаем своим потоком
                    currentCall = call;
                    statusText.innerText = "Трансляция идет... (ID: " + peer.id + ")";
                    
                    call.on('close', () => {
                        stopStream();
                    });
                });

                // Если пользователь нажмет "Остановить" в системном меню Android
                localStream.getVideoTracks()[0].onended = () => {
                    stopStream();
                };

            } catch (err) {
                console.error("Ошибка захвата экрана: " + err);
                alert("Не удалось захватить экран. Убедитесь, что используете HTTPS.");
            }
        }

        // --- ЛОГИКА "СМОТРЕТЬ" ---
        function startWatching() {
            // 1. Запрашиваем ID у пользователя
            const destId = prompt("Введите ID того, кто показывает экран:", "");
            
            if (!destId) return;

            // 2. Инициализируем Peer
            initPeer();

            // 3. Ждем готовности Peer, затем звоним
            peer.on('open', (id) => {
                statusText.innerText = "Подключение к " + destId + "...";
                
                const call = peer.call(destId, null); // Звоним без своего потока (мы только слушаем)
                
                call.on('stream', (remoteStream) => {
                    // Получили поток!
                    showStreamInterface();
                    videoElement.srcObject = remoteStream;
                    statusText.innerText = "Просмотр трансляции...";
                    currentCall = call;
                });

                call.on('close', () => {
                    stopStream();
                });
                
                call.on('error', (err) => {
                    alert("Ошибка подключения. Проверьте ID.");
                    stopStream();
                });
            });
        }

        // --- ОБЩИЕ ФУНКЦИИ ---

        function showStreamInterface() {
            menu.classList.add('hidden');
            streamView.style.display = 'flex';
        }

        function stopStream() {
            // Останавливаем треки (камеру/экран)
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            // Закрываем соединение
            if (currentCall) {
                currentCall.close();
                currentCall = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }

            // Сбрасываем видео
            videoElement.srcObject = null;

            // Возвращаем меню
            streamView.style.display = 'none';
            menu.classList.remove('hidden');
            statusText.innerText = "";
        }
    </script>
</body>
</html>
